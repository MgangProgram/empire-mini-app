<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1c">
  <title>EMPIRE | Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f7f2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(132, 75, 190, .28), transparent 55%),
        linear-gradient(145deg, #09070f, #171024 55%, #0b0912);
    }
    .panel {
      width: min(100%, 520px); padding: 48px 28px; text-align: center;
      border: 1px solid rgba(210, 177, 255, .2); border-radius: 28px;
      background: rgba(24, 17, 37, .82);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }
    .mark {
      width: 68px; height: 68px; margin: 0 auto 22px; display: grid;
      place-items: center; border-radius: 21px; font-size: 30px; font-weight: 800;
      color: white; background: linear-gradient(135deg, #a66bdf, #58318d);
      box-shadow: 0 10px 32px rgba(139, 83, 198, .32);
    }
    h1 { margin: 0; letter-spacing: .16em; font-size: clamp(30px, 8vw, 42px); }
    .tag { margin: 10px 0 30px; color: #bda8d5; letter-spacing: .12em; font-size: 12px; }
    .welcome { font-size: 22px; margin: 0 0 8px; }
    .fa { margin: 0 0 30px; color: #c7b8d8; direction: rtl; }
    .start {
      display: inline-block; padding: 14px 24px; border-radius: 14px;
      color: white; text-decoration: none; font-weight: 650;
      background: linear-gradient(100deg, #8952c5, #6335a0);
      box-shadow: 0 8px 24px rgba(111, 63, 166, .28);
    }
    .start:focus-visible { outline: 3px solid #d8b8ff; outline-offset: 4px; }
    footer { margin-top: 34px; color: #857594; font-size: 12px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true">E</div>
    <h1>EMPIRE</h1>
    <div class="tag">WELCOME TO THE EMPIRE</div>
    <p class="welcome">Welcome!</p>
    <p class="fa">سلام! خوش آمدید 👋</p>
    <p>Welcome to EMPIRE.</p>
    <p class="fa">به امپراتوری خوش آمدید.</p>
    <a class="start" href="#" onclick="return false;">Let's Get Started | شروع کنیم</a>
    <footer>EMPIRE</footer>
  </main>
</body>
</html>
